<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#222"><link rel="manifest" href="manifest.webmanifest"><title>حسابیار</title><style>body{font-family:Tahoma;margin:0;background:#f4f5f7}.wrap{max-width:850px;margin:auto;padding:18px}.card,section{background:white;padding:16px;border-radius:14px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num{font-size:22px;font-weight:bold;margin-top:7px}.green{color:#087a3e}.red{color:#b42318}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #ddd}button{background:#222;color:#fff;border:0}.row{display:grid;grid-template-columns:1fr 130px 150px 90px;gap:8px}.quick{display:flex;gap:8px}.quick input{flex:1}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:right;font-size:13px}#install{display:none;background:#087a3e}@media(max-width:650px){.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row input:first-child{grid-column:1/-1}}</style></head><body><div class="wrap"><h1>حسابیار شخصی</h1><small>آفلاین • درآمد و هزینه • ثبت با جمله فارسی</small><p><button id="install">📱 نصب حسابیار</button></p><div class="cards"><div class="card">موجودی خالص<div id="bal" class="num">۰</div></div><div class="card">درآمد<div id="inc" class="num green">۰</div></div><div class="card">هزینه<div id="exp" class="num red">۰</div></div></div><section><h3>ثبت سریع</h3><div class="quick"><input id="q" placeholder="مثلاً ۵ میلیون خرج سوخت کردم"><button onclick="quickAdd()">ثبت</button></div></section><section><h3>ثبت دستی</h3><div class="row"><input id="d" placeholder="شرح"><select id="t"><option value="income">درآمد</option><option value="expense">هزینه</option></select><input id="a" type="number" placeholder="مبلغ"><button onclick="manual()">ثبت</button></div><p><button onclick="backup()">پشتیبان</button> <button onclick="document.getElementById('file').click()">بازیابی</button><input id="file" type="file" accept=".json" hidden onchange="restore(event)"></p></section><section><h3>تراکنش‌ها</h3><table><thead><tr><th>شرح</th><th>نوع</th><th>مبلغ</th><th>تاریخ</th><th></th></tr></thead><tbody id="list"></tbody></table></section></div><script>
const K="hesabyar_pwa";let x=JSON.parse(localStorage.getItem(K)||"[]");const fa=n=>new Intl.NumberFormat("fa-IR").format(Math.round(n));function save(){localStorage.setItem(K,JSON.stringify(x));render()}function add(d,t,a){if(!d||!a)return;x.unshift({id:Date.now()+Math.random(),d,t,a:+a,date:new Date().toLocaleDateString("fa-IR")});save()}function manual(){add(d.value.trim(),t.value,a.value);d.value="";a.value=""}function norm(s){return s.replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c)).replace(/[٬,]/g,"")}function money(s){let m=norm(s).match(/(\d+(?:\.\d+)?)\s*(میلیارد|میلیون|هزار)?/);if(!m)return 0;let n=+m[1];if(m[2]=="میلیارد")n*=1e9;if(m[2]=="میلیون")n*=1e6;if(m[2]=="هزار")n*=1e3;return n}function quickAdd(){let s=q.value,n=money(s);if(!n)return alert("مبلغ را متوجه نشدم");let typ=/درآمد|دریافت|فروش|گرفتم|واریز|حقوق/.test(s)?"income":"expense";let desc=s.replace(/[۰-۹0-9٬,]+\s*(میلیارد|میلیون|هزار)?/g,"").replace(/امروز|خرج|هزینه|درآمد|دریافت|فروش|گرفتم|واریز|حقوق|کردم|کرد|دادم/g,"").trim();add(desc||"ثبت سریع",typ,n);q.value=""}function render(){let i=x.filter(z=>z.t=="income").reduce((s,z)=>s+z.a,0),e=x.filter(z=>z.t=="expense").reduce((s,z)=>s+z.a,0);inc.textContent=fa(i);exp.textContent=fa(e);bal.textContent=fa(i-e);list.innerHTML=x.map(z=>`<tr><td>${String(z.d).replace(/[&<>"']/g,"")}</td><td>${z.t=="income"?"درآمد":"هزینه"}</td><td>${fa(z.a)}</td><td>${z.date}</td><td><button onclick="del(${z.id})">حذف</button></td></tr>`).join("")}function del(id){x=x.filter(z=>z.id!=id);save()}function backup(){let b=new Blob([JSON.stringify(x)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="hesabyar-backup.json";a.click()}function restore(e){let r=new FileReader();r.onload=()=>{try{x=JSON.parse(r.result);save()}catch{alert("فایل نامعتبر است")}};r.readAsText(e.target.files[0])}render();let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;install.style.display="inline-block"});install.onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;install.style.display="none"}};if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
